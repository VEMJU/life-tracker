<!doctype html>
<html lang="en">
<head>
<script src="vendor/theme-bridge.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>The Map</title>
<!--
  THE MAP — every place you have to be, every place worth going back to, and
  every route you have moved along.

  FIVE KINDS, one model. A pin is a place; a trip and a route are two pins with
  a line between them:
     task      somewhere you have to go, with a deadline
     spot      a shop / restaurant worth rating and revisiting
     delivery  an order landing at an address, rateable when it arrives
     trip      point A → point B (the Uber, the drive)
     route     point A → point B under your own power, timed — pace, and
               whether you beat your own best on that same named route

  REGIONS let you keep more than one life on the map: New York, PA, Puebla.
  Each stores its own centre + zoom, so switching is one tap.

  Map imagery: Leaflet (vendored locally) + OpenStreetMap tiles, inverted to
  dark by CSS. Free, no API key, no billing. Falls back to CARTO if OSM fails.
  Tile images are the ONE thing here needing internet. Everything you type is
  local: nv.map.v2 in this browser.
-->
<!-- Leaflet is VENDORED (vendor/), not pulled from a CDN. A blocked CDN request
     took the whole script down and left this tab black with no explanation. -->
<link rel="stylesheet" href="vendor/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff;
  --accent:#E8E8E8; --accent-br:#FFFFFF;
  --over:#ff6b6b; --today:#f5c451; --gold:#f5c451; --pr:#f5c451;
  --muted:rgba(255,255,255,.5); --muted-strong:rgba(255,255,255,.72);
  --rule:rgba(255,255,255,.08); --rule-strong:rgba(255,255,255,.16);
  --card:rgba(255,255,255,.022);
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:rgba(232,232,232,.25)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

.wrap{display:flex;height:100vh;width:100%;position:relative;z-index:1}
#map{position:absolute;inset:0;background:#000;z-index:1}

/* the app's drifting crosses, behind everything */
#crossbg{position:fixed;inset:0;z-index:0;pointer-events:none}

/* OSM ships light tiles; invert them so the map matches the rest of the app.
   Skipped when we have fallen back to CARTO, which is dark already. */
.leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.5)}
html.noInvert .leaflet-tile{filter:none}
.mapWrap{position:relative;flex:1;min-width:0}
/* slightly translucent so the drifting crosses read faintly behind the panel */
.panel{width:372px;flex:none;height:100%;display:flex;flex-direction:column;
  border-right:1px solid var(--rule);background:rgba(6,6,7,.84);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);z-index:2}
@media(max-width:860px){
  .wrap{flex-direction:column-reverse}
  .panel{width:100%;height:50%;border-right:0;border-top:1px solid var(--rule)}
  .mapWrap{height:50%}
}

.pHead{padding:18px 18px 12px;border-bottom:1px solid var(--rule)}
.kick{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--serif);font-size:29px;line-height:1.05;margin-top:6px}
.sub{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted-strong);margin-top:4px}

/* search — find a place by name instead of hunting for it on the map */
.searchRow{display:flex;align-items:center;gap:9px;margin:12px 18px 0;padding:10px 12px;
  border:1px solid var(--rule-strong);border-radius:12px;background:rgba(255,255,255,.03);
  transition:border-color .2s var(--ease)}
.searchRow:focus-within{border-color:var(--accent)}
.searchIcon{width:15px;height:15px;flex:none;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round}
#searchInput{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--fg);font-size:14px}
#searchInput::placeholder{color:rgba(255,255,255,.32)}
#searchInput::-webkit-search-cancel-button{display:none}
#searchClear{flex:none;color:var(--muted);font-size:17px;line-height:1;padding:0 2px}
#searchClear:hover{color:var(--fg)}

.results{margin:8px 18px 0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;
  background:rgba(10,10,12,.96);max-height:250px;overflow-y:auto}
.res{display:block;width:100%;text-align:left;padding:11px 13px;border:0;background:none;cursor:pointer;
  border-bottom:1px solid var(--rule);transition:background .15s var(--ease)}
.res:last-child{border-bottom:0}
.res:hover{background:rgba(255,255,255,.06)}
.resName{font-size:13.5px;font-weight:600;color:var(--fg)}
.resWhere{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.resNote{padding:12px 13px;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);text-align:center}

/* regions — your several lives, one tap apart */
.regions{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.rg{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:6px 12px;position:relative;
  transition:color .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
.rg:hover{color:var(--fg);border-color:var(--rule-strong)}
.rg.on{background:var(--accent);color:#000;border-color:var(--accent)}
.rg .x{margin-left:6px;opacity:.45}
.rg .x:hover{opacity:1}
.rgAdd{color:var(--muted);border-style:dashed}

.filters{display:flex;gap:5px;flex-wrap:wrap;padding:12px 18px 0}
.fBtn{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:5px 10px;
  transition:color .2s var(--ease),background .2s var(--ease),border-color .2s var(--ease)}
.fBtn:hover{color:var(--fg)}
.fBtn.on{background:rgba(255,255,255,.1);color:var(--fg);border-color:var(--rule-strong)}

.list{flex:1;overflow-y:auto;padding:12px 13px 20px;display:flex;flex-direction:column;gap:8px}
.place{position:relative;display:flex;gap:10px;align-items:flex-start;padding:12px 12px 12px 15px;
  border:1px solid var(--rule);border-radius:14px;background:var(--card);cursor:pointer;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .12s var(--spring)}
.place:hover{border-color:var(--rule-strong);background:rgba(255,255,255,.05)}
.place:active{transform:scale(.99)}
.place::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:2px;border-radius:2px;background:var(--muted)}
.place.is-over::before{background:var(--over);box-shadow:0 0 9px var(--over)}
.place.is-today::before{background:var(--today);box-shadow:0 0 9px var(--today)}
.place.is-done::before{background:rgba(255,255,255,.18)}
.place.is-pr::before{background:var(--pr);box-shadow:0 0 10px var(--pr)}

.pCheck{flex:none;width:19px;height:19px;margin-top:1px;border-radius:6px;border:1px solid var(--rule-strong);
  display:grid;place-items:center;color:#000;transition:background .2s var(--ease),border-color .2s var(--ease),transform .12s var(--spring)}
.pCheck:active{transform:scale(.88)}
.place.is-done .pCheck{background:var(--accent);border-color:var(--accent)}
.pCheck svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pBody{flex:1;min-width:0}
.pTop{display:flex;align-items:center;gap:7px}
.pIcon{flex:none;width:15px;height:15px;color:var(--muted)}
.pIcon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pName{font-size:14px;font-weight:600;letter-spacing:-.01em;word-break:break-word;min-width:0}
.place.is-done .pName{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.pTask{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted-strong);margin-top:3px;word-break:break-word}
.pMeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:3px 8px}
.tag.is-over{color:var(--over);border-color:rgba(255,107,107,.4)}
.tag.is-today{color:var(--today);border-color:rgba(245,196,81,.4)}
.tag.is-pr{color:var(--pr);border-color:rgba(245,196,81,.5)}
.tag.pace{color:var(--fg);border-color:var(--rule-strong)}
.stars{display:inline-flex;gap:2px;font-size:11px;color:var(--gold);letter-spacing:.06em}
.stars .off{color:rgba(255,255,255,.2)}
.pDel{flex:none;color:rgba(255,255,255,.25);font-size:17px;line-height:1;padding:2px 4px;opacity:0;transition:opacity .2s,color .2s}
.place:hover .pDel{opacity:1}
.pDel:hover{color:var(--over)}

/* row actions — where this place can take you */
.pActs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.act{display:inline-flex;align-items:center;gap:5px;font-family:var(--serif);font-style:italic;font-size:13px;
  color:var(--fg);border:1px solid var(--rule-strong);border-radius:999px;padding:5px 11px;
  transition:border-color .2s var(--ease),background .2s var(--ease),transform .12s var(--spring)}
.act:hover{border-color:var(--accent);background:rgba(255,255,255,.06)}
.act:active{transform:scale(.95)}
.act svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act.ghost{color:var(--muted);border-color:var(--rule)}
.act.ghost:hover{color:var(--fg)}
/* a regular haunt gets a quiet marker — it is not a one-off errand */
.pReg{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  border:1px dashed var(--rule-strong);border-radius:999px;padding:3px 7px}

/* the per-route history bars — your pace, run over run */
.rtBars{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:9px}
.rtBars i{flex:1;min-width:2px;background:rgba(255,255,255,.22);border-radius:2px 2px 1px 1px;transition:background .2s}
.rtBars i.best{background:var(--pr);box-shadow:0 0 7px rgba(245,196,81,.5)}
.rtBars i.now{background:var(--accent)}

.empty{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);text-align:center;padding:34px 16px;line-height:1.6}

/* sheet */
.scrim{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:18px;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;animation:fade .18s var(--ease) forwards;overflow-y:auto}
@keyframes fade{to{opacity:1}}
.sheet{width:100%;max-width:430px;background:#0b0b0d;border:1px solid var(--rule-strong);border-radius:20px;padding:22px;margin:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.7);opacity:0;transform:translateY(10px) scale(.99);animation:pop .38s var(--spring) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.sTitle{font-family:var(--serif);font-size:24px;line-height:1.1}
.sCoord{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.kinds{display:flex;gap:5px;flex-wrap:wrap;margin-top:15px}
.kind{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  border:1px solid var(--rule);border-radius:999px;padding:6px 11px;transition:all .2s var(--ease)}
.kind:hover{color:var(--fg)}
.kind.on{background:var(--accent);color:#000;border-color:var(--accent)}
.f{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fL{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fI{background:rgba(255,255,255,.03);border:1px solid var(--rule-strong);border-radius:11px;padding:11px 13px;
  color:var(--fg);outline:none;width:100%;font-size:14px;transition:border-color .2s var(--ease)}
.fI:focus{border-color:var(--accent)}
textarea.fI{resize:vertical;min-height:66px;line-height:1.5}
.rate{display:flex;gap:5px;margin-top:2px}
.rate button{font-size:22px;color:rgba(255,255,255,.2);transition:color .15s var(--ease),transform .15s var(--spring);line-height:1}
.rate button:hover{transform:scale(1.15)}
.rate button.on{color:var(--gold)}
.sBtns{display:flex;gap:9px;margin-top:20px}
.bt{flex:1;border-radius:12px;padding:12px;font-size:13.5px;font-weight:600;transition:transform .15s var(--spring),background .2s,border-color .2s}
.bt:active{transform:scale(.97)}
.bt.save{background:var(--accent);color:#000}
.bt.ghost{border:1px solid var(--rule-strong);color:var(--muted-strong)}
.bt.ghost:hover{color:var(--fg);border-color:var(--muted)}
.note{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);margin-top:12px;line-height:1.5}

/* leaflet reskin */
.leaflet-container{background:#000;font-family:var(--sans)}
.leaflet-control-zoom a{background:rgba(10,10,12,.9)!important;color:#fff!important;border-color:var(--rule)!important}
.leaflet-control-zoom a:hover{background:rgba(30,30,34,.95)!important}
.leaflet-control-attribution{background:rgba(0,0,0,.6)!important;color:rgba(255,255,255,.35)!important;font-size:9px!important}
.leaflet-control-attribution a{color:rgba(255,255,255,.55)!important}
.leaflet-popup-content-wrapper{background:#0b0b0d;color:#fff;border:1px solid var(--rule-strong);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.7)}
.leaflet-popup-tip{background:#0b0b0d;border:1px solid var(--rule-strong)}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.popName{font-family:var(--serif);font-size:18px;line-height:1.15}
.popTask{font-family:var(--serif);font-style:italic;color:var(--muted-strong);margin-top:4px}
.popWhen{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:7px}

.pin{width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #000;
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 12px rgba(232,232,232,.5)}
.pin.is-over{background:var(--over);box-shadow:0 0 0 1px rgba(255,107,107,.5),0 0 16px rgba(255,107,107,.75);animation:pulse 2s var(--ease) infinite}
.pin.is-today{background:var(--today);box-shadow:0 0 0 1px rgba(245,196,81,.5),0 0 16px rgba(245,196,81,.7)}
.pin.is-done{background:rgba(255,255,255,.28);box-shadow:none;animation:none}
.pin.sm{width:11px;height:11px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.22);opacity:.75}}

.fabs{position:absolute;right:14px;bottom:22px;z-index:500;display:flex;flex-direction:column;gap:9px}
.fab{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:rgba(10,10,12,.92);border:1px solid var(--rule-strong);color:var(--fg);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,.55);transition:transform .15s var(--spring),border-color .2s,background .2s}
.fab:hover{border-color:var(--accent)} .fab:active{transform:scale(.92)}
.fab.on{background:var(--accent);color:#000;border-color:var(--accent)}
.fab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.banner{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:600;
  background:rgba(10,10,12,.94);border:1px solid var(--accent);border-radius:999px;padding:10px 18px;
  font-family:var(--serif);font-style:italic;font-size:14.5px;white-space:nowrap;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 12px 34px rgba(0,0,0,.6)}
.banner b{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-right:9px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:950;
  background:rgba(18,18,20,.95);border:1px solid var(--rule-strong);border-radius:999px;padding:11px 20px;
  font-family:var(--serif);font-style:italic;font-size:15px;opacity:0;pointer-events:none;
  transition:opacity .3s var(--ease),transform .3s var(--ease)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.pr{border-color:var(--pr);box-shadow:0 0 30px -8px rgba(245,196,81,.6)}

/* ── WEATHER, DOCKED RIGHT ────────────────────────────────────────────────────
   The liquid-glass card, ported off React. The distortion is an SVG filter
   (feTurbulence + feDisplacementMap) on a blurred backdrop layer; the wet edge
   is two inset shadows. framer-motion's whileHover/whileTap become :hover and
   :active. No library, no build step.

   Layered exactly as the original: bend (blur+distort) → face (glow) →
   edge (inner highlight) → content. */
.wx{position:absolute;top:14px;right:14px;z-index:420;width:318px;max-width:calc(100% - 28px);
  display:flex;flex-direction:column;gap:9px;pointer-events:auto}
@media(max-width:860px){.wx{width:auto;left:14px}}

.glass{position:relative;border-radius:18px;overflow:hidden;
  transition:transform .25s var(--ease)}
.glass:hover{transform:scale(1.008)}
.glass__bend{position:absolute;inset:0;z-index:0;border-radius:inherit;
  -webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);
  filter:url(#wxGlass)}
.glass__face{position:absolute;inset:0;z-index:1;border-radius:inherit;
  box-shadow:0 4px 4px rgba(0,0,0,.28),0 0 12px rgba(0,0,0,.18),0 0 24px rgba(255,255,255,.06)}
.glass__edge{position:absolute;inset:0;z-index:2;border-radius:inherit;
  box-shadow:inset 1.5px 1.5px 1px 0 rgba(255,255,255,.20),
             inset -1.5px -1.5px 1px 0 rgba(255,255,255,.14)}
.glass__in{position:relative;z-index:3;background:rgba(255,255,255,.05)}

/* hourly strip */
.wxHours{display:flex;justify-content:space-between;padding:13px 14px}
.wxH{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.wxH b{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:rgba(255,255,255,.62);font-weight:400}
.wxH i{font-family:var(--serif);font-style:italic;font-size:14px;color:#fff;font-variant-numeric:tabular-nums}
.wxH.now b{color:#fff}

/* the two square cards */
.wxPair{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.wxBig{padding:14px}
.wxTemp{font-family:var(--serif);font-style:italic;font-size:38px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.wxDesc{font-size:11.5px;color:rgba(255,255,255,.72);margin-top:5px;line-height:1.35;text-transform:capitalize}
.wxRange{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:rgba(255,255,255,.55);margin-top:4px}
.wxClock{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.wxDate{font-size:11px;color:rgba(255,255,255,.66);margin-top:5px}
.wxPin{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:4px 9px;border-radius:999px;
  background:rgba(0,0,0,.22);font-size:10.5px;color:#fff;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.wxPin svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.9}

/* 5-day list */
.wxDays{padding:11px 14px;display:flex;flex-direction:column;gap:9px}
.wxD{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wxD span{font-size:11.5px;color:rgba(255,255,255,.82)}
.wxD em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.06em;color:rgba(255,255,255,.6);
  font-variant-numeric:tabular-nums}
.wxD .ic{display:flex;align-items:center;gap:8px;min-width:0}

/* place switcher — driven by your saved regions, plus wherever you are */
.wxPlaces{display:flex;gap:5px;flex-wrap:wrap;padding:10px 12px}
.wxP{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 10px;
  transition:color .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease)}
.wxP:hover{color:#fff;border-color:rgba(255,255,255,.4)}
.wxP.on{background:rgba(255,255,255,.9);color:#000;border-color:transparent}

/* collapsed: a single pill that never fights the map */
.wxToggle{position:absolute;top:0;right:0;z-index:430;display:flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
  background:rgba(10,10,12,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.wxToggle:hover{color:#fff;border-color:rgba(255,255,255,.36)}
.wx.isShut .wxBody{display:none}
.wx:not(.isShut) .wxToggle{position:static;align-self:flex-end}
.wxBody{display:flex;flex-direction:column;gap:9px}
.wxNote{padding:13px 14px;font-family:var(--serif);font-style:italic;font-size:12.5px;
  color:rgba(255,255,255,.7);line-height:1.5}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<canvas id="crossbg"></canvas>

<div class="wrap">
  <aside class="panel">
    <div class="pHead">
      <p class="kick">The Map</p>
      <h1 class="h1">Where you have to be</h1>
      <p class="sub" id="sub">Tap the map to drop a place.</p>
    </div>
    <div class="searchRow">
      <svg class="searchIcon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="Search a place or address…" autocomplete="off" />
      <button id="searchClear" aria-label="Clear" hidden>×</button>
    </div>
    <div class="results" id="results" hidden></div>

    <div class="regions" id="regions"></div>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </aside>

  <div class="mapWrap">
    <div id="map"></div>
    <div class="banner" id="banner" hidden></div>

    <!-- the distortion behind the glass. Hidden; referenced by filter:url() -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="wxGlass" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.003 0.007" numOctaves="1" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="42" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>

    <aside class="wx isShut" id="wx">
      <button class="wxToggle" id="wxToggle" type="button">
        <span id="wxToggleTxt">Weather</span>
      </button>
      <div class="wxBody" id="wxBody"><!-- injected --></div>
    </aside>

    <div class="fabs">
      <button class="fab" id="locate" title="Find me">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <button class="fab" id="lineMode" title="Draw a trip or route (click start, then end)">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M7.7 16.3 16.3 7.7"/></svg>
      </button>
      <button class="fab" id="fit" title="Show everything here">
        <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="sheetRoot"></div>
<div class="toast" id="toast"></div>

<script src="vendor/leaflet.js"></script>
<script>
(() => {
'use strict';

/* If Leaflet is missing for any reason, say so on screen. Silence is what made
   this hard to diagnose — a black rectangle tells you nothing. */
if (typeof L === 'undefined') {
  document.getElementById('map').innerHTML =
    '<div style="display:grid;place-items:center;height:100%;padding:30px;text-align:center;' +
    'font-family:Georgia,serif;font-style:italic;color:rgba(255,255,255,.6);line-height:1.6">' +
    'The map library did not load.<br>Everything else on this page still works.</div>';
  return;
}

const KEY = 'nv.map.v2', OLD = 'nv.map.v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = p => (p||'p') + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* Tabs a place can lead to. Pick one and the pin gets an "Open <tab>" button
   that switches the app to whatever actually tracks that place — the gym pin
   takes you to the Gym tab. Sent to the parent app by postMessage, because this
   tab lives in an iframe and cannot change tabs on its own. */
const TABS = ['gym','supplements','subscriptions','vitals','peak','stocks','goals','reminders',
              'nutrition','finance','photos','academics','logs','clothes','sports','calendar'];
const TAB_LABEL = t => t.charAt(0).toUpperCase() + t.slice(1);
/* `anchor` is the free-text second half: which page/section inside that tab.
   "Sports" + "soccer" lands you on soccer, not just the Sports tab. */
function goToTab(tab, anchor){
  try { parent.postMessage({ source:'nv-embed', type:'go', tab:tab, anchor:anchor||'' }, '*'); } catch(e){}
}
/* Directions need no API key — Google's universal URL takes plain coordinates. */
function directionsURL(p){
  const dest = `${p.lat},${p.lng}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
}

/* the five kinds */
const KINDS = {
  task:     { label:'To do',    icon:'<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/>', line:false, rate:false },
  spot:     { label:'Spot',     icon:'<path d="m12 3 2.6 5.6 6.1.8-4.5 4.2 1.2 6-5.4-3-5.4 3 1.2-6L3.3 9.4l6.1-.8Z"/>',              line:false, rate:true  },
  delivery: { label:'Delivery', icon:'<path d="M3 8.5 12 4l9 4.5v7L12 20l-9-4.5Z"/><path d="M3 8.5 12 13l9-4.5M12 13v7"/>',           line:false, rate:true  },
  trip:     { label:'Trip',     icon:'<path d="M5 17h14M6 17V9l2-4h8l2 4v8"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/>', line:true, rate:false },
  route:    { label:'Route',    icon:'<path d="M13 4.5a1.6 1.6 0 1 0 0-.1M8 21l2.5-6 3 2 1-4"/><path d="M6 11.5 9 9l3.5 2"/>',         line:true,  rate:false },
};

let S = load();
let filter = 'all';
let markers = new Map(), lines = new Map();
let lineDraft = null;              // { from:{lat,lng} } while drawing a trip/route

function load(){
  try { const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (o && Array.isArray(o.places)) return normalise(o); } catch(e){}
  /* carry over anything from the first version of this tab */
  try { const old = JSON.parse(localStorage.getItem(OLD) || 'null');
    if (old && Array.isArray(old.places)) {
      return normalise({ places: old.places.map(p => ({...p, kind:'task'})), regions: [], activeRegion:null, view: old.view });
    }
  } catch(e){}
  return normalise({ places: [], regions: [], activeRegion: null, view: null });
}
function normalise(o){
  o.places  = (o.places  || []).map(p => ({ kind:'task', rating:0, done:false, tab:'', anchor:'', regular:false, ...p }));
  o.regions = o.regions || [];
  return o;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

let toastT;
function toast(msg, pr){
  const t = $('toast'); t.textContent = msg; t.classList.toggle('pr', !!pr); t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), pr ? 3600 : 2400);
}

/* ── dates ── */
const todayKey = () => { const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function stateOf(p){
  if (p.done) return 'done';
  if (!p.when) return 'none';
  const day = p.when.slice(0,10), t = todayKey();
  return day < t ? 'over' : day === t ? 'today' : 'none';
}
function whenLabel(p){
  if (!p.when) return '';
  const [y,m,d] = p.when.slice(0,10).split('-').map(Number);
  const time = p.when.length > 10 ? p.when.slice(11,16) : '';
  const s = new Date(y, m-1, d).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const st = stateOf(p);
  return (st === 'over' ? 'Overdue · ' : st === 'today' ? 'Today · ' : '') + s + (time ? ' ' + time : '');
}

/* ── pace maths: the part that makes routes worth logging ── */
function paceOf(p){
  if (!p.dist || !p.secs) return null;
  return p.secs / p.dist;                       // seconds per unit
}
function fmtPace(sec){
  if (sec == null) return '—';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + ':' + String(s).padStart(2,'0');
}
function fmtDur(secs){
  if (!secs) return '—';
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
  return (h ? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(s).padStart(2,'0');
}
/* every previous run of the same named route, oldest first */
function routeHistory(p){
  const name = (p.name || '').trim().toLowerCase();
  if (!name) return [];
  return S.places
    .filter(x => x.kind === 'route' && (x.name||'').trim().toLowerCase() === name && paceOf(x) != null)
    .sort((a,b) => (a.when||'').localeCompare(b.when||''));
}
/* did this beat every earlier attempt? (lower pace = faster) */
function isPR(p){
  const pace = paceOf(p); if (pace == null) return false;
  const hist = routeHistory(p).filter(x => x.id !== p.id);
  if (!hist.length) return false;
  return pace < Math.min(...hist.map(paceOf));
}

/* ── map ── */
const startView = S.view || { lat: 40.7128, lng: -74.0060, z: 12 };
const map = L.map('map', { zoomControl: true }).setView([startView.lat, startView.lng], startView.z);
/* counts tile successes/failures for the diagnostic panel below */
const diag = { loaded: 0, errors: 0 };

/* TILES. CARTO's dark tiles were the first choice but their CDN can be blocked,
   which leaves a black rectangle. OpenStreetMap's own servers are the most
   widely reachable on the internet, so they are the primary now — and the
   `.leaflet-tile` CSS filter inverts them into a dark map, so the look survives.
   If OSM ever fails too, we fall back to CARTO rather than showing nothing. */
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

let switched = false;
osm.on('tileerror', () => {
  diag.errors++;
  if (switched) return;
  switched = true;
  map.removeLayer(osm);
  const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 20
  }).addTo(map);
  carto.on('tileload', () => { diag.loaded++; hideDiag(); });
  carto.on('tileerror', () => { diag.errors++; showDiag(); });
  document.documentElement.classList.add('noInvert');   // CARTO is already dark
  toast('Switched map source');
});
osm.on('tileload', () => { diag.loaded++; hideDiag(); });

/* ── SELF-DIAGNOSIS ──────────────────────────────────────────────────────────
   A black map says nothing. This panel reports what is actually happening —
   whether the container has size, whether tiles are arriving — and removes
   itself the instant a single tile loads. If you can see it, read it to me. */
function diagBox(){
  let b = document.getElementById('mapDiag');
  if (!b) {
    b = document.createElement('div');
    b.id = 'mapDiag';
    b.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:400;' +
      'max-width:320px;padding:16px 18px;border-radius:14px;background:rgba(10,10,12,.94);' +
      'border:1px solid rgba(255,255,255,.18);font-family:ui-monospace,Menlo,monospace;font-size:11px;' +
      'line-height:1.7;color:rgba(255,255,255,.75);text-align:left;pointer-events:none';
    document.querySelector('.mapWrap').appendChild(b);
  }
  return b;
}
function showDiag(){
  const el = document.getElementById('map');
  diagBox().innerHTML =
    'MAP DIAGNOSTIC<br>' +
    'leaflet: loaded<br>' +
    'container: ' + el.clientWidth + ' x ' + el.clientHeight + '<br>' +
    'tiles ok: ' + diag.loaded + '<br>' +
    'tile errors: ' + diag.errors + '<br>' +
    'source: ' + (switched ? 'carto' : 'osm') + '<br>' +
    (el.clientWidth === 0 ? '&rarr; container has no size' :
     diag.errors > 0 ? '&rarr; tiles are being blocked' :
     '&rarr; waiting for tiles…');
}
function hideDiag(){
  const b = document.getElementById('mapDiag');
  if (b && diag.loaded > 0) b.remove();
}
setTimeout(() => { if (diag.loaded === 0) showDiag(); }, 2500);
setTimeout(() => { if (diag.loaded === 0) showDiag(); }, 6000);

map.on('moveend', () => {
  const c = map.getCenter();
  S.view = { lat: c.lat, lng: c.lng, z: map.getZoom() };
  save();
});

map.on('click', (e) => {
  if (lineDraft) {                       // second click closes a trip / route
    const from = lineDraft.from;
    lineDraft = null; setLineMode(false);
    openSheet(null, from.lat, from.lng, { toLat: e.latlng.lat, toLng: e.latlng.lng, kind: 'route' });
    return;
  }
  openSheet(null, e.latlng.lat, e.latlng.lng);
});

function setLineMode(on){
  $('lineMode').classList.toggle('on', on);
  const b = $('banner');
  if (on) { b.hidden = false; b.innerHTML = '<b>Step 1</b> Click where it starts'; }
  else if (!lineDraft) b.hidden = true;
}
$('lineMode').addEventListener('click', () => {
  if (lineDraft) { lineDraft = null; setLineMode(false); toast('Cancelled'); return; }
  const on = !$('lineMode').classList.contains('on');
  setLineMode(on);
  if (on) {
    const once = (e) => {
      lineDraft = { from: { lat: e.latlng.lat, lng: e.latlng.lng } };
      $('banner').innerHTML = '<b>Step 2</b> Click where it ends';
      map.off('click', once);
    };
    map.once('click', once);
  }
});

function pinIcon(p, small){
  const st = stateOf(p);
  return L.divIcon({ className:'', iconSize: small ? [11,11] : [16,16], iconAnchor: small ? [5.5,5.5] : [8,8],
    html: `<div class="pin ${small ? 'sm' : ''} ${st==='over'?'is-over':st==='today'?'is-today':''} ${p.done?'is-done':''}"></div>` });
}

function draw(){
  markers.forEach(m => map.removeLayer(m)); markers.clear();
  lines.forEach(l => map.removeLayer(l));   lines.clear();

  S.places.forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(p) }).addTo(map);
    const pace = paceOf(p);
    m.bindPopup(`<div class="popName">${esc(p.name || KINDS[p.kind].label)}</div>
      ${p.task ? `<div class="popTask">${esc(p.task)}</div>` : ''}
      ${p.rating ? `<div class="popWhen">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</div>` : ''}
      ${pace != null ? `<div class="popWhen">${p.dist} ${esc(p.unit||'mi')} · ${fmtDur(p.secs)} · ${fmtPace(pace)}/${esc(p.unit||'mi')}${isPR(p)?' · ★ PR':''}</div>` : ''}
      ${p.when ? `<div class="popWhen">${esc(whenLabel(p))}</div>` : ''}`);
    m.on('dblclick', () => openSheet(p));
    markers.set(p.id, m);

    if (KINDS[p.kind].line && p.toLat != null) {
      const end = L.marker([p.toLat, p.toLng], { icon: pinIcon(p, true) }).addTo(map);
      markers.set(p.id + '_to', end);
      const poly = L.polyline([[p.lat,p.lng],[p.toLat,p.toLng]], {
        color: isPR(p) ? '#f5c451' : '#E8E8E8', weight: 2.5, opacity: p.done ? .3 : .85,
        dashArray: p.kind === 'trip' ? '5 6' : null
      }).addTo(map);
      lines.set(p.id, poly);
    }
  });
}

/* ── regions ── */
function renderRegions(){
  const el = $('regions');
  el.innerHTML = S.regions.map(r =>
    `<button class="rg ${S.activeRegion===r.id?'on':''}" data-rg="${r.id}">${esc(r.name)}<span class="x" data-rgdel="${r.id}">×</span></button>`
  ).join('') + `<button class="rg rgAdd" id="rgAdd">+ Save this view</button>`;
}
$('regions').addEventListener('click', (e) => {
  const del = e.target.closest('[data-rgdel]');
  if (del) { e.stopPropagation(); S.regions = S.regions.filter(r => r.id !== del.dataset.rgdel);
    if (S.activeRegion === del.dataset.rgdel) S.activeRegion = null;
    if (S.wx.place === del.dataset.rgdel) S.wx.place = null;   // don't point at a deleted place
    save(); renderRegions(); if (!$('wx').classList.contains('isShut')) renderWx(); return; }
  if (e.target.closest('#rgAdd')) {
    const name = window.prompt('Name this place — "New York", "Puebla", "PA"…');
    if (!name || !name.trim()) return;
    const c = map.getCenter();
    S.regions.push({ id: uid('r'), name: name.trim(), lat: c.lat, lng: c.lng, z: map.getZoom() });
    S.activeRegion = S.regions[S.regions.length-1].id;
    /* the weather place list IS the region list, so it has to hear about this */
    save(); renderRegions(); if (!$('wx').classList.contains('isShut')) renderWx();
    toast('Region saved'); return;
  }
  const b = e.target.closest('[data-rg]');
  if (b) {
    const r = S.regions.find(x => x.id === b.dataset.rg); if (!r) return;
    S.activeRegion = r.id; save(); renderRegions();
    map.flyTo([r.lat, r.lng], r.z, { duration: .8 });
  }
});

/* ── WEATHER ─────────────────────────────────────────────────────────────────
   Several places at once, each with its own local clock, because "what time is
   it there" is half the reason to watch more than one city.

   The places ARE your saved regions — no second list to maintain. Add a region
   and it appears here; delete it and it leaves.

   Responses are cached for 15 minutes per coordinate. OpenWeather's free tier
   allows 60 calls a minute, which is generous, but re-fetching every time you
   toggle a panel is still rude and slow for no benefit. */
const WX_TTL = 15 * 60 * 1000;
const wxCache = new Map();          // 'lat,lon' -> { at, data }
S.wx = S.wx || { place: null, open: false };

const WX_ICONS = {
  clear:  '<circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/>',
  partly: '<circle cx="9" cy="9" r="3.4"/><path d="M9 2.6v1.8M2.6 9h1.8M4.9 4.9l1.3 1.3"/><path d="M8.5 19h9a3.2 3.2 0 0 0 .3-6.4A4.6 4.6 0 0 0 9.3 13a3 3 0 0 0-.8 6Z"/>',
  cloud:  '<path d="M7.5 19h9.8a3.4 3.4 0 0 0 .3-6.8A5 5 0 0 0 8.3 12.6a3.2 3.2 0 0 0-.8 6.4Z"/>',
  rain:   '<path d="M7.5 15.5h9.8a3.4 3.4 0 0 0 .3-6.8A5 5 0 0 0 8.3 9.1a3.2 3.2 0 0 0-.8 6.4Z"/><path d="M9 18.6l-.9 2.2M13 18.6l-.9 2.2M17 18.6l-.9 2.2"/>',
  storm:  '<path d="M7.5 14.5h9.8a3.4 3.4 0 0 0 .3-6.8A5 5 0 0 0 8.3 8.1a3.2 3.2 0 0 0-.8 6.4Z"/><path d="M13 17l-2.6 4h3l-1.2 3"/>',
  snow:   '<path d="M7.5 14.8h9.8a3.4 3.4 0 0 0 .3-6.8A5 5 0 0 0 8.3 8.4a3.2 3.2 0 0 0-.8 6.4Z"/><path d="M9.4 18.4h.01M12.4 20.2h.01M15.4 18.4h.01M12.4 17.4h.01"/>',
  haze:   '<path d="M3.5 9h17M5.5 13h13M7.5 17h9"/>',
};
const wxIcon = (kind, size) =>
  `<svg class="wxIco" ${size ? `style="width:${size}px;height:${size}px"` : ''} viewBox="0 0 24 24" `
  + `fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">`
  + (WX_ICONS[kind] || WX_ICONS.cloud) + '</svg>';

/* every time shown is the PLACE's time, built by shifting UTC by its offset */
const wxLocal = (unixSec, tz) => new Date(((unixSec ?? Math.floor(Date.now() / 1000)) + (tz || 0)) * 1000);
const pad2 = (n) => String(n).padStart(2, '0');
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function wxPlaces(){
  const list = S.regions.map(r => ({ id: r.id, name: r.name, lat: r.lat, lng: r.lng }));
  const c = map.getCenter();
  /* always one entry for wherever the map is looking, so this works before you
     have saved a single region */
  list.unshift({ id: '__view', name: 'This view', lat: c.lat, lng: c.lng });
  return list;
}
function wxActive(){
  const list = wxPlaces();
  return list.find(p => p.id === S.wx.place) || list[0];
}

async function wxFetch(lat, lng){
  const k = lat.toFixed(3) + ',' + lng.toFixed(3);
  const hit = wxCache.get(k);
  if (hit && Date.now() - hit.at < WX_TTL) return hit.data;
  const r = await fetch(`/api/weather?lat=${lat}&lon=${lng}`);
  const d = await r.json();
  /* only cache a real answer — caching "no_key" for 15 minutes would hide the
     moment the key starts working */
  if (!d.error) wxCache.set(k, { at: Date.now(), data: d });
  return d;
}

function wxShell(inner){
  return `<div class="glass"><div class="glass__bend"></div><div class="glass__face"></div>`
       + `<div class="glass__edge"></div><div class="glass__in">${inner}</div></div>`;
}

function wxPlaceRow(active){
  return wxShell('<div class="wxPlaces">' + wxPlaces().map(p =>
    `<button class="wxP ${p.id === active.id ? 'on' : ''}" data-wxp="${esc(p.id)}">${esc(p.name)}</button>`
  ).join('') + '</div>');
}

async function renderWx(){
  const body = $('wxBody'); if (!body) return;
  const wrap = $('wx');
  $('wxToggleTxt').textContent = wrap.classList.contains('isShut') ? 'Weather' : 'Hide';
  if (wrap.classList.contains('isShut')) { body.innerHTML = ''; return; }

  const active = wxActive();
  body.innerHTML = wxShell(`<p class="wxNote">Reading the sky over ${esc(active.name)}…</p>`) + wxPlaceRow(active);
  wireWxPlaces();

  let d;
  try { d = await wxFetch(active.lat, active.lng); }
  catch (e) { d = { error: 'fetch_failed' }; }

  if (d.error) {
    const msg = d.error === 'no_key'
      ? 'No weather key on the live site yet. Add OPENWEATHER_API_KEY in Vercel and redeploy.'
      : d.error === 'upstream' && d.status === 401
        ? 'OpenWeather rejected the key. Brand-new keys take an hour or two to activate — this is what that looks like.'
        : 'Could not reach the weather service just now.';
    body.innerHTML = wxShell(`<p class="wxNote">${esc(msg)}</p>`) + wxPlaceRow(active);
    wireWxPlaces();
    return;
  }

  const tz = d.now.tzOffset;
  const nowL = wxLocal(null, tz);

  const hours = (d.hourly || []).map((h, i) => {
    const t = wxLocal(h.at, tz);
    return `<div class="wxH ${i === 0 ? 'now' : ''}"><b>${pad2(t.getUTCHours())}:00</b>`
         + wxIcon(h.kind, 17) + `<i>${h.tempC == null ? '—' : (h.tempC > 0 ? '+' : '') + h.tempC}°</i></div>`;
  }).join('');

  const days = (d.daily || []).map((day, i) => {
    const t = wxLocal(day.at, tz);
    const label = i === 0 ? 'Today' : DOW[t.getUTCDay()] + ', ' + t.getUTCDate() + ' ' + MON[t.getUTCMonth()];
    return `<div class="wxD"><span class="ic">${wxIcon(day.kind, 17)}<span>${esc(label)}</span></span>`
         + `<em>${day.hiC == null ? '—' : (day.hiC > 0 ? '+' : '') + day.hiC}° / ${day.loC == null ? '—' : (day.loC > 0 ? '+' : '') + day.loC}°</em></div>`;
  }).join('');

  body.innerHTML =
    (hours ? wxShell(`<div class="wxHours">${hours}</div>`) : '') +
    `<div class="wxPair">` +
      wxShell(`<div class="wxBig">
        <div class="wxTemp">${(d.now.tempC > 0 ? '+' : '') + d.now.tempC}°</div>
        <div class="wxDesc">${esc(d.now.desc || '')}</div>
        <div class="wxRange">${d.now.hiC == null ? '' : (d.now.hiC > 0 ? '+' : '') + d.now.hiC + '° / ' + ((d.now.loC > 0 ? '+' : '') + d.now.loC) + '°'}</div>
      </div>`) +
      wxShell(`<div class="wxBig">
        <div class="wxClock">${pad2(nowL.getUTCHours())}:${pad2(nowL.getUTCMinutes())}</div>
        <div class="wxDate">${DOW[nowL.getUTCDay()]}, ${MON[nowL.getUTCMonth()]} ${nowL.getUTCDate()}</div>
        <span class="wxPin"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>${esc(d.place || active.name)}</span>
      </div>`) +
    `</div>` +
    (days ? wxShell(`<div class="wxDays">${days}</div>`) : '') +
    wxPlaceRow(active);

  wireWxPlaces();
}

function wireWxPlaces(){
  /* this file only has $ (by id) — no $$ helper, unlike app.js */
  $('wxBody').querySelectorAll('[data-wxp]').forEach(b => b.addEventListener('click', () => {
    S.wx.place = b.dataset.wxp; save(); renderWx();
    /* switching the weather place moves the map there too — one gesture, and
       it keeps the panel honest about what you are looking at */
    const p = wxPlaces().find(x => x.id === S.wx.place);
    if (p && p.id !== '__view') map.flyTo([p.lat, p.lng], map.getZoom(), { duration: .7 });
  }));
}

$('wxToggle').addEventListener('click', () => {
  const wrap = $('wx');
  wrap.classList.toggle('isShut');
  S.wx.open = !wrap.classList.contains('isShut'); save();
  renderWx();
});

/* left open last time? open it again — but only after the map exists, since the
   place list reads map.getCenter() for "This view" */
if (S.wx.open) { $('wx').classList.remove('isShut'); renderWx(); }

/* ── SEARCH ──────────────────────────────────────────────────────────────────
   Nominatim is OpenStreetMap's own geocoder: free, no API key, no billing. It
   asks for courtesy in return — at most one request a second — so we wait until
   you stop typing rather than firing on every keystroke. */
const searchInput = $('searchInput'), resultsEl = $('results'), clearBtn = $('searchClear');
let searchTimer = null, lastQuery = '';

function hideResults(){ resultsEl.hidden = true; resultsEl.innerHTML = ''; }

async function runSearch(q){
  if (q === lastQuery) return;
  lastQuery = q;
  resultsEl.hidden = false;
  resultsEl.innerHTML = '<p class="resNote">Searching…</p>';
  try {
    /* bias results toward wherever you are looking now */
    const c = map.getCenter();
    const url = 'https://nominatim.openstreetmap.org/search'
      + '?format=json&limit=6&addressdetails=1'
      + '&q=' + encodeURIComponent(q)
      + '&viewbox=' + [c.lng-1.2, c.lat+1.2, c.lng+1.2, c.lat-1.2].join(',');
    const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!r.ok) throw new Error('search failed');
    const list = await r.json();
    if (!list.length) { resultsEl.innerHTML = '<p class="resNote">Nothing found.</p>'; return; }
    resultsEl.innerHTML = list.map((p, i) => {
      const parts = (p.display_name || '').split(',');
      const name  = parts.shift().trim();
      const where = parts.slice(0, 3).join(',').trim();
      return `<button class="res" data-i="${i}">
        <span class="resName">${esc(name)}</span>
        ${where ? `<span class="resWhere">${esc(where)}</span>` : ''}
      </button>`;
    }).join('');
    resultsEl.querySelectorAll('.res').forEach(b => b.addEventListener('click', () => {
      const hit = list[+b.dataset.i]; if (!hit) return;
      const lat = parseFloat(hit.lat), lng = parseFloat(hit.lon);
      map.flyTo([lat, lng], 16, { duration: .8 });
      hideResults();
      searchInput.value = '';
      clearBtn.hidden = true;
      /* offer to keep it: the sheet opens pre-named with what you searched */
      setTimeout(() => openSheet(null, lat, lng, { name: (hit.display_name || '').split(',')[0].trim() }), 850);
    }));
  } catch (e) {
    resultsEl.innerHTML = '<p class="resNote">Search is unavailable right now.</p>';
  }
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  clearBtn.hidden = !q;
  clearTimeout(searchTimer);
  if (q.length < 3) { hideResults(); lastQuery = ''; return; }
  searchTimer = setTimeout(() => runSearch(q), 550);   // wait for you to stop typing
});
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { searchInput.value = ''; clearBtn.hidden = true; hideResults(); }
  if (e.key === 'Enter')  { clearTimeout(searchTimer); const q = searchInput.value.trim(); if (q.length >= 3) runSearch(q); }
});
clearBtn.addEventListener('click', () => {
  searchInput.value = ''; clearBtn.hidden = true; hideResults(); lastQuery = ''; searchInput.focus();
});

/* ── filters ── */
function renderFilters(){
  const counts = { all: S.places.length };
  Object.keys(KINDS).forEach(k => counts[k] = S.places.filter(p => p.kind === k).length);
  $('filters').innerHTML =
    `<button class="fBtn ${filter==='all'?'on':''}" data-f="all">All ${counts.all||''}</button>` +
    Object.entries(KINDS).map(([k,v]) =>
      `<button class="fBtn ${filter===k?'on':''}" data-f="${k}">${v.label}${counts[k]?' '+counts[k]:''}</button>`).join('') +
    `<button class="fBtn ${filter==='done'?'on':''}" data-f="done">Done</button>`;
}
$('filters').addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]'); if (!b) return;
  filter = b.dataset.f; render();
});

/* ── list ── */
function visible(){
  /* "All" hides finished errands but KEEPS regular haunts — the gym does not
     disappear from your map because you went once. */
  if (filter === 'all')  return S.places.filter(p => !p.done || p.regular);
  if (filter === 'done') return S.places.filter(p => p.done);
  return S.places.filter(p => p.kind === filter);
}
function sortPlaces(list){
  const rank = p => p.done ? 3 : stateOf(p)==='over' ? 0 : stateOf(p)==='today' ? 1 : 2;
  return [...list].sort((a,b) => rank(a)-rank(b) || (a.when||'9999').localeCompare(b.when||'9999'));
}
function starHTML(n){
  return `<span class="stars">${[1,2,3,4,5].map(i => `<span class="${i<=n?'':'off'}">★</span>`).join('')}</span>`;
}
function routeBars(p){
  const hist = routeHistory(p); if (hist.length < 2) return '';
  const paces = hist.map(paceOf);
  const best = Math.min(...paces), worst = Math.max(...paces);
  const span = (worst - best) || 1;
  return `<div class="rtBars">${hist.map(x => {
    const pc = paceOf(x);
    /* faster = taller, so the bars read as "better is bigger" */
    const h = 22 - ((pc - best) / span) * 17;
    const cls = pc === best ? 'best' : x.id === p.id ? 'now' : '';
    return `<i class="${cls}" style="height:${h.toFixed(0)}px" title="${fmtPace(pc)}"></i>`;
  }).join('')}</div>`;
}

function render(){
  const open = S.places.filter(p => !p.done).length;
  const over = S.places.filter(p => stateOf(p) === 'over').length;
  $('sub').textContent = !S.places.length ? 'Tap the map to drop a place.'
    : over ? `${over} overdue · ${open} still to do`
    : open ? `${open} still to do` : 'All clear.';

  renderRegions(); renderFilters();

  const list = sortPlaces(visible());
  const el = $('list');
  if (!list.length) {
    el.innerHTML = `<p class="empty">${
      filter === 'done' ? 'Nothing finished yet.'
      : filter === 'all' ? 'No places yet.<br>Tap anywhere on the map to mark somewhere you need to be.'
      : `No ${KINDS[filter] ? KINDS[filter].label.toLowerCase() : ''} entries yet.`}</p>`;
    draw(); return;
  }
  el.innerHTML = list.map(p => {
    const st = stateOf(p), K = KINDS[p.kind] || KINDS.task, pace = paceOf(p), pr = isPR(p);
    return `<div class="place ${p.done?'is-done':''} ${pr?'is-pr':st==='over'?'is-over':st==='today'?'is-today':''}" data-go="${p.id}">
      <button class="pCheck" data-tog="${p.id}" aria-label="Mark done">${p.done?'<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>':''}</button>
      <div class="pBody">
        <div class="pTop">
          <span class="pIcon"><svg viewBox="0 0 24 24">${K.icon}</svg></span>
          <p class="pName">${esc(p.name || K.label)}</p>
        </div>
        ${p.task ? `<p class="pTask">${esc(p.task)}</p>` : ''}
        <div class="pMeta">
          ${p.when ? `<span class="tag ${st==='over'?'is-over':st==='today'?'is-today':''}">${esc(whenLabel(p))}</span>` : ''}
          ${K.rate && p.rating ? starHTML(p.rating) : ''}
          ${pace != null ? `<span class="tag pace">${p.dist} ${esc(p.unit||'mi')} · ${fmtPace(pace)}/${esc(p.unit||'mi')}</span>` : ''}
          ${pr ? `<span class="tag is-pr">★ Best yet</span>` : ''}
          ${p.regular ? `<span class="pReg">Regular</span>` : ''}
        </div>
        ${p.kind === 'route' ? routeBars(p) : ''}
        <div class="pActs">
          <button class="act" data-dir="${p.id}" title="Directions in Google Maps">
            <svg viewBox="0 0 24 24"><path d="M12 2 3 21l9-4 9 4Z"/></svg>Directions</button>
          ${p.tab ? `<button class="act" data-tab="${esc(p.tab)}" data-anchor="${esc(p.anchor||'')}" title="Open the ${esc(TAB_LABEL(p.tab))} tab">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>${esc(p.anchor ? TAB_LABEL(p.tab)+' · '+p.anchor : TAB_LABEL(p.tab))}</button>` : ''}
          <button class="act ghost" data-edit="${p.id}">Edit</button>
        </div>
      </div>
      <button class="pDel" data-del="${p.id}" aria-label="Delete">×</button>
    </div>`;
  }).join('');
  draw();
}

/* ── the sheet ── */
function openSheet(place, lat, lng, extra){
  const isNew = !place;
  const p = place || Object.assign(
    { id: uid(), kind:'task', name:'', task:'', when:'', notes:'', rating:0,
      dist:'', secs:0, unit:'mi', lat, lng, toLat:null, toLng:null, done:false }, extra || {});
  let kind = p.kind;
  let rating = p.rating || 0;

  const mins = p.secs ? Math.floor(p.secs/60) : '';
  const secsR = p.secs ? p.secs%60 : '';

  const body = () => {
    const K = KINDS[kind];
    return `
      <div class="kinds">${Object.entries(KINDS).map(([k,v]) =>
        `<button class="kind ${k===kind?'on':''}" data-k="${k}" ${(!K.line && v.line && p.toLat==null && !isNew)?'':''}>${v.label}</button>`).join('')}</div>

      <label class="f"><span class="fL">${kind==='delivery'?'What is coming':kind==='route'||kind==='trip'?'Name this route':'Place'}</span>
        <input class="fI" id="fName" maxlength="70" placeholder="${
          kind==='spot' ? 'The coffee place on 5th'
          : kind==='delivery' ? 'Running shoes'
          : kind==='route' ? 'River loop'
          : kind==='trip' ? 'Airport run'
          : "The bank, Mum's, the gym…"}" value="${esc(p.name)}"></label>

      <label class="f"><span class="fL">${kind==='spot'?'What you got / why go back':kind==='delivery'?'Notes on the order':'What you need to do'}</span>
        <input class="fI" id="fTask" maxlength="140" value="${esc(p.task)}"></label>

      <label class="f"><span class="fL">When</span>
        <input class="fI" id="fWhen" type="datetime-local" value="${esc(p.when)}"></label>

      ${K.rate ? `<div class="f"><span class="fL">Rating</span>
        <div class="rate" id="rate">${[1,2,3,4,5].map(i=>`<button data-r="${i}" class="${i<=rating?'on':''}">★</button>`).join('')}</div></div>` : ''}

      ${K.line ? `<div class="f"><span class="fL">Distance &amp; time</span>
        <div class="fRow">
          <input class="fI" id="fDist" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Distance" value="${esc(p.dist)}">
          <select class="fI" id="fUnit">
            <option value="mi" ${p.unit==='mi'?'selected':''}>miles</option>
            <option value="km" ${p.unit==='km'?'selected':''}>km</option>
          </select>
        </div>
        <div class="fRow" style="margin-top:8px">
          <input class="fI" id="fMin" type="number" min="0" inputmode="numeric" placeholder="Minutes" value="${mins}">
          <input class="fI" id="fSec" type="number" min="0" max="59" inputmode="numeric" placeholder="Seconds" value="${secsR}">
        </div>
        ${kind==='route' ? `<p class="note">Use the same name each time you run this route and it will tell you when you have beaten yourself.</p>` : ''}
      </div>` : ''}

      <div class="f"><span class="fL">Leads to</span>
        <select class="fI" id="fTab">
          <option value="">— nothing, it is just a place —</option>
          ${TABS.map(t => `<option value="${t}" ${p.tab===t?'selected':''}>${TAB_LABEL(t)} tab</option>`).join('')}
        </select>
      </div>

      <label class="f"><span class="fL">…and which part of it (optional)</span>
        <input class="fI" id="fAnchor" maxlength="40" placeholder="soccer · push day · the loop" value="${esc(p.anchor||'')}">
        <p class="note">Pick the tab that tracks this place, and optionally which page inside it. Soccer training at the field → <b>Sports · soccer</b>, and the pin takes you straight there.</p>
      </label>

      <label class="f" style="flex-direction:row;align-items:center;gap:10px">
        <input type="checkbox" id="fReg" ${p.regular?'checked':''} style="width:17px;height:17px;accent-color:#E8E8E8">
        <span class="fL" style="letter-spacing:.1em">Somewhere I go regularly (keep it after it is done)</span>
      </label>

      <label class="f"><span class="fL">Notes</span>
        <textarea class="fI" id="fNotes" maxlength="600" placeholder="Anything future-you will want to know…">${esc(p.notes)}</textarea></label>`;
  };

  const paint = () => {
    $('sheetBody').innerHTML = body();
    $('sheetBody').querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
      kind = b.dataset.k; paint();
    }));
    const r = $('rate');
    if (r) r.addEventListener('click', (e) => {
      const b = e.target.closest('[data-r]'); if (!b) return;
      rating = (rating === +b.dataset.r) ? 0 : +b.dataset.r; paint();
    });
  };

  $('sheetRoot').innerHTML = `
    <div class="scrim" id="scrim">
      <div class="sheet" role="dialog" aria-modal="true">
        <p class="sTitle">${isNew ? 'Mark this place' : 'Edit'}</p>
        <p class="sCoord">${Number(p.lat).toFixed(5)}, ${Number(p.lng).toFixed(5)}${p.toLat!=null?` → ${Number(p.toLat).toFixed(4)}, ${Number(p.toLng).toFixed(4)}`:''}</p>
        <div id="sheetBody"></div>
        <div class="sBtns">
          <button class="bt ghost" id="cancel">Cancel</button>
          <button class="bt save" id="saveBtn">${isNew ? 'Save it' : 'Save'}</button>
        </div>
      </div>
    </div>`;
  paint();

  const close = () => { $('sheetRoot').innerHTML = ''; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('scrim').addEventListener('click', e => { if (e.target.id === 'scrim') close(); });
  $('cancel').addEventListener('click', close);
  setTimeout(() => $('fName') && $('fName').focus(), 60);

  $('saveBtn').addEventListener('click', () => {
    p.kind = kind; p.rating = rating;
    p.name  = ($('fName')  || {}).value ? $('fName').value.trim()  : '';
    p.task  = ($('fTask')  || {}).value ? $('fTask').value.trim()  : '';
    p.when  = ($('fWhen')  || {}).value || '';
    p.notes = ($('fNotes') || {}).value ? $('fNotes').value.trim() : '';
    p.tab     = ($('fTab') || {}).value || '';
    p.anchor  = ($('fAnchor') || {}).value ? $('fAnchor').value.trim() : '';
    p.regular = !!($('fReg') && $('fReg').checked);
    if (KINDS[kind].line) {
      p.dist = parseFloat($('fDist').value) || '';
      p.unit = $('fUnit').value;
      p.secs = (parseInt($('fMin').value,10) || 0) * 60 + (parseInt($('fSec').value,10) || 0);
    }
    if (!p.name && !p.task) { toast('Give it a name or a task'); return; }
    if (isNew) S.places.push(p);
    save();
    const pr = p.kind === 'route' && isPR(p);
    render(); close();
    if (pr) toast('★ Best yet on ' + (p.name || 'this route'), true);
    else toast(isNew ? 'Saved to the map' : 'Saved');
    if (isNew) map.panTo([p.lat, p.lng]);
  });
}

/* ── list wiring ── */
$('list').addEventListener('click', (e) => {
  const tog = e.target.closest('[data-tog]');
  if (tog) { const p = S.places.find(x => x.id === tog.dataset.tog);
    if (p) { p.done = !p.done; save(); render(); if (p.done) toast('Done'); } return; }
  const del = e.target.closest('[data-del]');
  if (del) { S.places = S.places.filter(x => x.id !== del.dataset.del); save(); render(); toast('Removed'); return; }

  /* open turn-by-turn directions to this place */
  const dir = e.target.closest('[data-dir]');
  if (dir) { e.stopPropagation();
    const p = S.places.find(x => x.id === dir.dataset.dir); if (!p) return;
    window.open(directionsURL(p), '_blank', 'noopener'); return; }

  /* jump to the tab that actually tracks this place */
  const tab = e.target.closest('[data-tab]');
  if (tab) { e.stopPropagation(); goToTab(tab.dataset.tab, tab.dataset.anchor); return; }

  const ed = e.target.closest('[data-edit]');
  if (ed) { e.stopPropagation();
    const p = S.places.find(x => x.id === ed.dataset.edit); if (p) openSheet(p); return; }

  const go = e.target.closest('[data-go]');
  if (go) {
    const p = S.places.find(x => x.id === go.dataset.go); if (!p) return;
    if (p.toLat != null) map.flyToBounds(L.latLngBounds([[p.lat,p.lng],[p.toLat,p.toLng]]), { padding:[60,60], duration:.7 });
    else map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 15), { duration:.7 });
    const m = markers.get(p.id); if (m) setTimeout(() => m.openPopup(), 720);
  }
});

$('locate').addEventListener('click', () => {
  if (!navigator.geolocation) { toast('Location not available'); return; }
  toast('Finding you…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      map.flyTo([pos.coords.latitude, pos.coords.longitude], 15, { duration:.8 });
      L.circleMarker([pos.coords.latitude, pos.coords.longitude],
        { radius:7, color:'#E8E8E8', fillColor:'#E8E8E8', fillOpacity:.9, weight:2 })
        .addTo(map).bindPopup('<div class="popName">You are here</div>');
    },
    () => toast('Could not get your location — check the browser prompt')
  );
});
$('fit').addEventListener('click', () => {
  if (!S.places.length) { toast('Nothing on the map yet'); return; }
  const pts = [];
  S.places.forEach(p => { pts.push([p.lat,p.lng]); if (p.toLat != null) pts.push([p.toLat,p.toLng]); });
  map.fitBounds(L.latLngBounds(pts), { padding:[55,55], maxZoom:16 });
});

/* on first open, offer to start where you actually are */
if (!S.places.length && !S.regions.length && !S.view && navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => map.setView([pos.coords.latitude, pos.coords.longitude], 13),
    () => {}
  );
}

render();

/* ── the hidden-tab problem ──────────────────────────────────────────────────
   This page loads inside a tab that starts hidden, so Leaflet initialises into
   a 0×0 box and paints nothing. A one-shot timer cannot fix that: when it
   fires, the tab is often still hidden. So watch the container instead and
   recalculate the moment it genuinely has a size — which is exactly when you
   switch to the tab. */
const mapEl = document.getElementById('map');
let sized = false;
function refit(){
  if (!mapEl.clientWidth || !mapEl.clientHeight) return;
  map.invalidateSize();
  if (!sized) {                       // first real paint: settle the view too
    sized = true;
    const v = S.view || startView;
    map.setView([v.lat, v.lng], v.z);
  }
}
if (window.ResizeObserver) new ResizeObserver(refit).observe(mapEl);
document.addEventListener('visibilitychange', refit);
window.addEventListener('resize', refit);
window.addEventListener('pageshow', refit);
[60, 250, 700, 1500].forEach(ms => setTimeout(refit, ms));   // belt and braces
})();
</script>
<script>
/* drifting cross-sigils — the same backdrop as every other tab */
(function crosses(){
  var cv = document.getElementById('crossbg'); if (!cv) return;
  var ctx = cv.getContext('2d', { alpha: true });
  var W=0,H=0,DPR=1,items=[],raf;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function countFor(w,h){ return Math.max(18, Math.min(90, Math.round((w*h)/26000))); }
  function seed(){
    items = [];
    var COUNT = countFor(W,H);
    for (var i=0;i<COUNT;i++){
      var depth = Math.random();
      items.push({ x:Math.random()*W, y:Math.random()*H, size:18+depth*78,
        rot:(Math.random()-0.5)*0.6, spin:(Math.random()-0.5)*0.0006,
        vy:-(0.06+depth*0.22), sway:Math.random()*Math.PI*2,
        swaySpeed:0.002+Math.random()*0.004, swayAmp:6+depth*16, baseX:0,
        alpha:0.07+depth*0.17 });
      items[i].baseX = items[i].x;
    }
  }
  function rr(x,y,w,h,r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); ctx.fill(); }
  function drawCross(c){
    var s=c.size, bw=s*0.13, cw=s*0.46;
    ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot); ctx.globalAlpha=c.alpha; ctx.fillStyle = window.NV_ACCENT || '#fff';
    rr(-bw/2,-s/2,bw,s,bw*0.4); rr(-cw/2,-s/2+s*0.26,cw,bw,bw*0.4);
    ctx.restore();
  }
  function resize(){
    DPR=Math.min(devicePixelRatio||1,2); W=cv.clientWidth||innerWidth; H=cv.clientHeight||innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0); seed();
  }
  function frame(){
    if (document.hidden){ raf=requestAnimationFrame(frame); return; }
    ctx.clearRect(0,0,W,H);
    for (var i=0;i<items.length;i++){
      var c=items[i];
      c.y+=c.vy; c.sway+=c.swaySpeed; c.x=c.baseX+Math.sin(c.sway)*c.swayAmp; c.rot+=c.spin;
      if (c.y+c.size<-10){ c.y=H+c.size; c.baseX=Math.random()*W; }
      drawCross(c);
    }
    ctx.globalAlpha=1; raf=requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize, { passive:true });
  if (reduce){ ctx.clearRect(0,0,W,H); items.forEach(drawCross); }
  else raf=requestAnimationFrame(frame);
})();
</script>
